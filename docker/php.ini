; Secret Santa PHP settings (on top of php.ini-production)
expose_php = Off
display_errors = Off
log_errors = On

; Export files are small, but leave room for years of history.
upload_max_filesize = 20M
post_max_size = 25M

; Keep admin logins across container restarts and updates.
session.save_path = /data/sessions
session.gc_maxlifetime = 28800
session.gc_probability = 1
session.gc_divisor = 100
