<VirtualHost *:8080>
    DocumentRoot /app/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    <Directory /app/html>
        Options -Indexes +FollowSymLinks
        # .htaccess handles the /r/ and /g/ short links and blocks hidden/backup files.
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
