# Builds the image and publishes it to ghcr.io whenever a version tag is pushed:
#   git tag v1.0.1 && git push origin v1.0.1
# Publishes ghcr.io/<owner>/secret-santa:1.0.1, :1.0 and :latest for PCs (amd64) and ARM (arm64).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write   # lets the built-in GITHUB_TOKEN publish to ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # emulation, to build the arm64 version
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/secret-santa
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
